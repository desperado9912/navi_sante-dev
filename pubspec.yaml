name: navi_sante
description: "A new Flutter project."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1


environment:
  sdk: ^3.10.0


# Dependencies specify other packages that your package needs in order to work.
# To upgrave dependencies to latest version: 'flutter pub upgrade --major-versions'
# Check outdated dependencies: 'flutter pub outdated'
dependencies:
  flutter:
    sdk: flutter

  json_annotation: ^4.8.1

  supabase: ^2.1.1
  
  supabase_flutter: ^2.12.2
  
  cupertino_icons: ^1.0.9

  lucide_icons_flutter: ^3.1.12

  flutter_lucide: ^1.8.2

  flutter_dotenv: ^6.0.0

  flutter_native_splash: ^2.4.7

  flutter_bloc: ^9.1.1

  flutter_map: ^8.3.0

  email_validator: ^3.0.0

  flutter_secure_storage: ^10.0.0

  app_links: ^7.0.0

  font_awesome_flutter: ^11.0.0
  
  flutter_svg: ^2.2.4

  get: ^4.7.3

  url_launcher: ^6.3.2

  share_plus: ^12.0.2

  connectivity_plus: ^6.1.5

  hive_flutter: ^1.1.0

  google_sign_in: ^7.2.0

  crypto: ^3.0.6

  latlong2: ^0.9.1

  geolocator: ^14.0.1

  permission_handler: ^11.3.0

  equatable: ^2.0.5

  flutter_map_cache: ^1.5.0

  path_provider: ^2.1.5

  http_cache_hive_store: ^5.1.0
  
  dio: ^5.7.0

  dio_cache_interceptor: ^3.5.1

  dio_cache_interceptor_hive_store: ^3.2.1

  flutter_map_marker_cluster: ^8.2.2

  cached_network_image: ^3.4.1
  
  shimmer: ^3.0.0

  bloc_concurrency: ^0.3.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3





dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.9

  json_serializable: ^6.7.1

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  bloc_test: ^10.0.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/navisante_logo_1024.png"
  adaptive_icon_foreground: "assets/navisante_adapt_logo_fg.png"
  adaptive_icon_background: "assets/navisante_adapt_logo_bg.png"



# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/



  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
